[package]
name = "mutop-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Piotr Błażejewicz (Peter Blazejewicz) <peterblazejewicz@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "Hardware telemetry and AI monitor for LattePanda Mu Ultra (Intel Core Ultra 7 256V Lunar Lake)"
readme = "README.md"
repository = "https://github.com/peterblazejewicz/mutop-ai"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
anyhow = "1.0"
raw-cpuid = "11.2"
libloading = "0.8"
ratatui = "0.28"
crossterm = "0.28"
edgetop-core = { path = "../edgetop-core" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_ToolHelp",
]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
print_literal = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
