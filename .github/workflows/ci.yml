name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peterblazejewicz/edgetop-core
          path: _edgetop-core
      - name: Place edgetop-core sibling
        shell: bash
        run: rm -rf ../edgetop-core && mv _edgetop-core ../edgetop-core
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peterblazejewicz/edgetop-core
          path: _edgetop-core
      - name: Place edgetop-core sibling
        shell: bash
        run: rm -rf ../edgetop-core && mv _edgetop-core ../edgetop-core
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  build-release:
    name: Windows Release Binary Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peterblazejewicz/edgetop-core
          path: _edgetop-core
      - name: Place edgetop-core sibling
        shell: bash
        run: rm -rf ../edgetop-core && mv _edgetop-core ../edgetop-core
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - name: Build Release
        run: cargo build --release
      - name: Package Windows Binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PKG_VER="${GITHUB_REF_NAME}"
          else
            PKG_VER="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          fi
          PKG_NAME="mutop-ai-${PKG_VER}-x86_64-pc-windows-msvc"
          7z a "dist/${PKG_NAME}.zip" ./target/release/mutop-ai.exe ./LICENSE-MIT ./LICENSE-APACHE ./README.md
          cd dist
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: mutop-ai-windows-release
          path: dist/
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mutop-ai-windows-release
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: true
